; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mkrzero

[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200
; Adafruit FreeTouch is NOT listed here on purpose. A lightly forked copy lives
; in lib/Adafruit_FreeTouch, which makes setCompCap() public so each pad's
; parasitic baseline can be calibrated out - see the comment in its header.
; Depending on the upstream package as well would compile adafruit_ptc.c twice
; and collide at link time.
; Arduino Low Power is gone too: the guitar must never sleep mid-song, and
; nothing in src/ uses it. Add it back if you build examples/original/.
lib_deps =
	adafruit/Adafruit LIS3DH@^1.3.0
	cmaglie/FlashStorage @ ^1.0.0

